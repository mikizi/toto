<body>
<div class="scene-bg" aria-hidden="true"></div>
<main class="scenario-page">
    <header class="hero">
        <nav class="top-nav" aria-label="Page navigation">
            <span class="brand-link">WC26 Toto</span>
            <div class="nav-actions">

                    <svg viewBox="0 0 24 24" aria-hidden="true">

        <section class="hero-grid" aria-labelledby="pageTitle">

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta name="theme-color" content="#0d1117" />
    <title>Player Bets · World Cup 2026 Toto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://flagcdn.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css">
    <link rel="stylesheet" href="css/styles.css?v=97">
    <link rel="icon" sizes="192x192" href="assets/icons/icon-192x192.png?v=3" type="image/png">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KPTMQ0C1KJ"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag("js", new Date());
        gtag("config", "G-KPTMQ0C1KJ");
    </script>
</head>
<body>
<div class="page-bg" role="presentation" aria-hidden="true"></div>
<main class="player-page">
    <header class="player-page-header glass-panel">
        <a class="player-back-link" href="./" aria-label="Back to scoreboard">Back</a>
        <div class="player-title-block">
            <span class="player-page-kicker">Player Bets</span>
            <h1 id="playerName" class="player-page-title">Loading...</h1>
            <p id="playerSummary" class="player-page-summary"></p>
        </div>
    </header>

    <section class="player-overview glass-panel" aria-label="Player overview">
        <div class="player-stat">
            <span class="player-stat-label">Rank</span>
            <span id="playerRank" class="player-stat-value">-</span>
        </div>
        <div class="player-stat">
            <span class="player-stat-label">Points</span>
            <span id="playerPoints" class="player-stat-value">-</span>
        </div>
        <div class="player-stat">
            <span class="player-stat-label">Winner</span>
            <span id="playerChampion" class="player-stat-value player-stat-team">-</span>
        </div>
        <div class="player-stat">
            <span class="player-stat-label">KO right</span>
            <span id="playerKnockoutCorrect" class="player-stat-value">-</span>
        </div>
    </section>

    <section class="player-knockout glass-panel" aria-label="Knockout picks">
        <div class="player-bets-header player-knockout-head">
            <span>Knockout predictions</span>
            <span id="playerKnockoutTotal">0 pts</span>
        </div>
        <div id="playerKnockoutCarousel" class="player-knockout-carousel"></div>
    </section>

    <section class="player-bets glass-panel" aria-label="All player bets">
        <div class="player-bets-header">
            <span>Match</span>
            <span>Pick</span>
            <span>Result</span>
            <span>Pts</span>
        </div>
        <div id="playerBetsList" class="player-bets-list"></div>
    </section>
</main>
<button id="playerBackToTop" class="player-back-to-top" type="button" aria-label="Back to top">
    <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 5 5 12l1.4 1.4L11 8.8V20h2V8.8l4.6 4.6L19 12 12 5Z" fill="currentColor"/>
    </svg>
</button>

<script src="js/flags.js?v=6"></script>
<script src="js/live.js?v=5"></script>
<script src="js/analytics.js?v=7"></script>
<script src="js/ga.js?v=2"></script>
<script src="js/player-page.js?v=30"></script>
</body>
</html>

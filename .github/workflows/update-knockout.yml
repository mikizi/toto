name: Update knockout

on:
  workflow_dispatch:
    inputs:
      action:
        description: Knockout action
        required: true
        type: choice
        options:
          - migrate_scoring
          - apply_r32_scoring
          - sync_fixtures
          - set_eliminated
          - lock_fixture
          - live_score
          - stop_live
          - confirm_winner
      match_id:
        description: Knockout match id
        required: false
        type: number
      home:
        description: Home team
        required: false
      away:
        description: Away team
        required: false
      home_score:
        description: Home score
        required: false
        type: number
      away_score:
        description: Away score
        required: false
        type: number
      winner:
        description: Advancing winner
        required: false
      eliminated_json:
        description: Eliminated teams JSON by round
        required: false
  repository_dispatch:
    types: [update-knockout]

concurrency:
  group: toto-data-writes
  cancel-in-progress: false

jobs:
  knockout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve inputs
        id: inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_MATCH_ID: ${{ inputs.match_id }}
          INPUT_HOME: ${{ inputs.home }}
          INPUT_AWAY: ${{ inputs.away }}
          INPUT_HOME_SCORE: ${{ inputs.home_score }}
          INPUT_AWAY_SCORE: ${{ inputs.away_score }}
          INPUT_WINNER: ${{ inputs.winner }}
          INPUT_ELIMINATED: ${{ inputs.eliminated_json }}
          DISPATCH_ACTION: ${{ github.event.client_payload.action }}
          DISPATCH_MATCH_ID: ${{ github.event.client_payload.matchId }}
          DISPATCH_HOME: ${{ github.event.client_payload.home }}
          DISPATCH_AWAY: ${{ github.event.client_payload.away }}
          DISPATCH_HOME_SCORE: ${{ github.event.client_payload.homeScore }}
          DISPATCH_AWAY_SCORE: ${{ github.event.client_payload.awayScore }}
          DISPATCH_WINNER: ${{ github.event.client_payload.winner }}
          DISPATCH_ELIMINATED: ${{ toJson(github.event.client_payload.eliminated) }}
        run: |
          write_output() {
            local name="$1"
            local value="${2:-}"
            local delimiter="EOF_${name}_$RANDOM"
            {
              echo "${name}<<${delimiter}"
              printf '%s\n' "${value}"
              echo "${delimiter}"
            } >> "$GITHUB_OUTPUT"
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            write_output "action" "${INPUT_ACTION}"
            write_output "match_id" "${INPUT_MATCH_ID}"
            write_output "home" "${INPUT_HOME}"
            write_output "away" "${INPUT_AWAY}"
            write_output "home_score" "${INPUT_HOME_SCORE}"
            write_output "away_score" "${INPUT_AWAY_SCORE}"
            write_output "winner" "${INPUT_WINNER}"
            write_output "eliminated_json" "${INPUT_ELIMINATED}"
          else
            write_output "action" "${DISPATCH_ACTION}"
            write_output "match_id" "${DISPATCH_MATCH_ID}"
            write_output "home" "${DISPATCH_HOME}"
            write_output "away" "${DISPATCH_AWAY}"
            write_output "home_score" "${DISPATCH_HOME_SCORE}"
            write_output "away_score" "${DISPATCH_AWAY_SCORE}"
            write_output "winner" "${DISPATCH_WINNER}"
            write_output "eliminated_json" "${DISPATCH_ELIMINATED}"
          fi

      - name: Refresh latest state
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

      - name: Setup Python and LibreOffice
        uses: ./.github/actions/setup-toto-ci
        with:
          libreoffice: "true"

      - name: Update knockout
        env:
          HOME: /tmp
          SAL_USE_VCLPLUGIN: gen
          KNOCKOUT_ACTION: ${{ steps.inputs.outputs.action }}
          MATCH_ID: ${{ steps.inputs.outputs.match_id }}
          HOME_TEAM: ${{ steps.inputs.outputs.home }}
          AWAY_TEAM: ${{ steps.inputs.outputs.away }}
          HOME_SCORE: ${{ steps.inputs.outputs.home_score }}
          AWAY_SCORE: ${{ steps.inputs.outputs.away_score }}
          WINNER: ${{ steps.inputs.outputs.winner }}
          ELIMINATED_JSON: ${{ steps.inputs.outputs.eliminated_json }}
        run: |
          args=("${KNOCKOUT_ACTION}")
          if [ -n "${MATCH_ID}" ]; then args+=("--match-id" "${MATCH_ID}"); fi
          if [ -n "${HOME_TEAM}" ]; then args+=("--home" "${HOME_TEAM}"); fi
          if [ -n "${AWAY_TEAM}" ]; then args+=("--away" "${AWAY_TEAM}"); fi
          if [ -n "${HOME_SCORE}" ]; then args+=("--home-score" "${HOME_SCORE}"); fi
          if [ -n "${AWAY_SCORE}" ]; then args+=("--away-score" "${AWAY_SCORE}"); fi
          if [ -n "${WINNER}" ]; then args+=("--winner" "${WINNER}"); fi
          if [ -n "${ELIMINATED_JSON}" ] && [ "${ELIMINATED_JSON}" != "null" ]; then args+=("--eliminated-json" "${ELIMINATED_JSON}"); fi
          PYTHONPATH=. python3 -u scripts/update_knockout.py "${args[@]}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add xlsx/Master\ WorldCup26.xlsx public/data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Knockout: ${{ steps.inputs.outputs.action }}"
          git push
